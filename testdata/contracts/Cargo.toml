# Golden fixture contracts for pkg/sepmeta tests (CLAUDE.md §5.4).
# Built only by scripts/build-fixtures.sh; normal builds and CI never need Rust.
[workspace]
resolver = "2"
members = [
    "common",
    "token_full_sep",
    "token_full_legacy",
    "token_partial",
    "not_token",
    "multi_sep",
    "no_meta",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
# Exact pins so the committed .wasm bytes can be reproduced.
soroban-sdk = "=28.0.0"
soroban-token-sdk = "=28.0.0"
common = { path = "common" }

# The profile recommended for Soroban contracts.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
