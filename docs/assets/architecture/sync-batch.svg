<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Sync batch transaction</title>
  <desc id="desc">The sync loop fetches a batch and prepares its facts before opening one transaction. It applies ledgers in order and commits changes with last ledger and checkpoint. A failure rolls back the batch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#43536b"/>
    </marker>
    <style>
      .box { fill: #f4f7fb; stroke: #43536b; stroke-width: 2; rx: 12; }
      .ok { fill: #edf7f0; stroke: #34734a; stroke-width: 2; rx: 12; }
      .bad { fill: #fff3f0; stroke: #a34837; stroke-width: 2; rx: 12; }
      .title { fill: #182433; font: 700 18px sans-serif; text-anchor: middle; }
      .label { fill: #35445a; font: 14px sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #43536b; stroke-width: 2.5; marker-end: url(#arrow); }
      .error { fill: none; stroke: #a34837; stroke-width: 2.5; marker-end: url(#arrow); }
      .note { fill: #56657a; font: italic 14px sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="box" x="35" y="75" width="205" height="110"/>
  <text class="title" x="137" y="110">Fetch ledger batch</text>
  <text class="label" x="137" y="140">from RPC</text>
  <text class="label" x="137" y="162">consecutive ledgers</text>

  <rect class="box" x="295" y="75" width="235" height="110"/>
  <text class="title" x="412" y="110">Prepare batch</text>
  <text class="label" x="412" y="140">extract facts; fetch and</text>
  <text class="label" x="412" y="162">analyze new Wasm</text>

  <rect class="box" x="585" y="75" width="255" height="110"/>
  <text class="title" x="712" y="110">Apply in ledger order</text>
  <text class="label" x="712" y="140">inside one SQLite transaction</text>
  <text class="label" x="712" y="162">include reference fan-out</text>

  <rect class="ok" x="895" y="75" width="265" height="110"/>
  <text class="title" x="1027" y="110">Commit batch</text>
  <text class="label" x="1027" y="140">data + last_ledger +</text>
  <text class="label" x="1027" y="162">protocol/checkpoint</text>

  <path class="arrow" d="M240 130 H283"/>
  <path class="arrow" d="M530 130 H573"/>
  <path class="arrow" d="M840 130 H883"/>
  <path class="arrow" d="M1027 185 V255 H137 V198"/>
  <text class="note" x="570" y="250">next batch starts after the committed ledger</text>

  <rect class="bad" x="585" y="300" width="255" height="90"/>
  <text class="title" x="712" y="335">Any apply or write error</text>
  <text class="label" x="712" y="365">rollback; progress stays at</text>
  <text class="label" x="712" y="384">the previous batch</text>
  <path class="error" d="M712 185 V288"/>
</svg>
