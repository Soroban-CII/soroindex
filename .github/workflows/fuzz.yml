name: fuzz

on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Duration per fuzz target (e.g. 10m, 1h)"
        required: false
        default: "10m"
  schedule:
    # Nightly run at 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.4"
  GOTOOLCHAIN: local
  FUZZTIME: ${{ github.event.inputs.fuzztime || '10m' }}

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Restore / save fuzz corpus cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Run fuzz targets
        run: make fuzz FUZZTIME=${{ env.FUZZTIME }}

      - name: Upload crasher artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ github.run_id }}
          path: |
            **/testdata/fuzz/**/*
          if-no-files-found: ignore

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "ci: nightly fuzz failure on ${{ github.sha }}" \
            --body "Nightly fuzz job failed. Crash artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repo "${{ github.repository }}" || echo "Unable to open issue automatically"
