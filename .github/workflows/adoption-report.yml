# Regenerates the testnet adoption report monthly (MAINTAINING.md, Monthly)
# and opens a pull request with the updated report/ files and a before/after
# table of headline numbers. It never pushes to main: a maintainer reviews
# and merges the PR.
#
# Mainnet needs the Hubble export (scripts/hubble-export.sql), which a
# maintainer runs by hand, so only testnet is automated.
#
# - If the RPC is unavailable, the job fails before running phase0 and opens
#   no PR.
# - If phase0 fails, the job fails and opens no PR.
# - If nothing in report/ changed, the job succeeds and opens no PR.
#
# A PR opened with GITHUB_TOKEN does not trigger the ci workflow; push an
# empty commit or close and reopen the PR to run checks before merging.
name: adoption-report

on:
  schedule:
    - cron: "41 4 1 * *" # 04:41 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adoption-report
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.4"
  GOTOOLCHAIN: local
  SEP47IDX_RPC_URL: https://soroban-testnet.stellar.org

jobs:
  testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # push the report branch (never main)
      pull-requests: write # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: RPC is available and on testnet
        shell: bash
        run: |
          set -euo pipefail
          body='{"jsonrpc":"2.0","id":1,"method":"getNetwork"}'
          if ! resp="$(curl -fsS --max-time 30 --retry 3 --retry-delay 10 -H 'Content-Type: application/json' -d "$body" "$SEP47IDX_RPC_URL")"; then
            echo "::error::RPC $SEP47IDX_RPC_URL is unavailable; no report generated and no PR opened"
            exit 1
          fi
          passphrase="$(jq -r '.result.passphrase // empty' <<<"$resp")"
          if [[ "$passphrase" != "Test SDF Network ; September 2015" ]]; then
            echo "::error::RPC did not report the testnet passphrase (got '${passphrase}'); no PR opened"
            exit 1
          fi
          echo "RPC ok: $passphrase"
      - name: keep the current summary
        shell: bash
        run: cp report/testnet-summary.json "$RUNNER_TEMP/before.json" 2>/dev/null || echo "no previous testnet summary"
      - name: regenerate the testnet report
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/sep47idx" ./cmd/sep47idx
          "$RUNNER_TEMP/sep47idx" phase0 --network testnet --sample 2000 --out report/
      - name: open a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- report/ && [[ -z "$(git ls-files --others --exclude-standard -- report/)" ]]; then
            echo "report/ unchanged; no PR opened"
            exit 0
          fi
          stamp="$(jq -r .generated_at report/testnet-summary.json)"
          branch="report/testnet-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- report/testnet-raw.csv report/testnet-contracts.csv report/testnet-summary.json report/ADOPTION.md
          git commit -m "docs(phase0): regenerate testnet adoption report ($stamp)"
          git push origin "$branch"
          body="$RUNNER_TEMP/body.md"
          {
            echo "Monthly testnet adoption report, generated by the \`adoption-report\` workflow ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
            echo
            echo "## Headline numbers"
            echo
            python3 scripts/report-summary-diff.py "$RUNNER_TEMP/before.json" report/testnet-summary.json
            echo
            echo "◀ marks a changed row. Every number comes from \`report/testnet-summary.json\` before and after this run."
            echo
            echo "## Files changed"
            echo
            git diff --stat HEAD~1 -- report/ | sed 's/^/    /'
            echo
            echo "Mainnet is not regenerated here: it needs the Hubble export (MAINTAINING.md)."
            echo "Review \`report/ADOPTION.md\` before merging. This PR was opened with GITHUB_TOKEN, so CI does not run until a maintainer pushes to the branch or closes and reopens the PR."
          } > "$body"
          gh pr create --base main --head "$branch" --title "docs(phase0): regenerate testnet adoption report ($stamp)" --body-file "$body"
