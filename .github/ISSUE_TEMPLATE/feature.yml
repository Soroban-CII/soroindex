name: Feature request
description: A new capability or a change to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What question can you not answer with the index today?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations: {required: true}
  - type: textarea
    id: tiers
    attributes:
      label: Trust tiers
      description: Which tier (declared, inferred, verified, protocol) does this touch? A feature must not present one tier as another.
