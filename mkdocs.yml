site_name: soroindex
site_description: A public index of Soroban smart contracts by the SEPs they declare and the interfaces they match.
site_url: https://ciscokwiz.github.io/soroindex/
repo_url: https://github.com/ciscokwiz/soroindex
repo_name: ciscokwiz/soroindex
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Introduction: index.md
  - Trust tiers: trust-tiers.md
  - How it works: how-it-works.md
  - CLI reference: cli.md
  - HTTP API: api.md
  - For contract authors: contract-authors.md
  - Writing a rule file: rule-files.md
  - Self-hosting: self-hosting.md
  - Adoption report: adoption.md
  - Prior art: prior-art.md
  - Contributing: contributing.md
  - Stellar Wave:
      - Application: wave/APPLICATION.md
      - Demo script: wave/DEMO.md
